<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmSpark Social Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Newsreader:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            background: #f8f6f3;
            color: #1a1a1a;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            padding: 80px 100px;
            gap: 70px;
        }

        .mark {
            width: 330px;
            height: 280px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mark img {
            width: 100%;
            height: auto;
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        .brand {
            font-family: 'Newsreader', serif;
            font-weight: 500;
            font-size: 28px;
            letter-spacing: 0.08em;
            color: #6b6560;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Newsreader', serif;
            font-weight: 400;
            font-size: 50px;
            line-height: 1.18;
            letter-spacing: -0.01em;
            color: #1a1a1a;
            margin-bottom: 36px;
        }

        .by {
            font-size: 19px;
            color: #6b6560;
            font-weight: 300;
            margin-top: 40px;
            border-top: 1px solid #d9d4ce;
            padding-top: 26px;
        }

        .by .name {
            color: #1a1a1a;
            font-weight: 500;
        }

        .hub {
            font-size: 17px;
            color: #c4a882;
            font-weight: 500;
            letter-spacing: 0.02em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="mark">
        <img src="omspark-mark.png" alt="OmSpark">
    </div>
    <div class="content">
        <div class="brand">OmSpark LLC</div>
        <h1>Technology consulting for enterprises building with AI.</h1>
        <div class="by">
            Founded by <span class="name">Nikhil Singhal</span>
            <div class="hub">nikhilsinghal.com</div>
        </div>
    </div>
</body>
</html>
